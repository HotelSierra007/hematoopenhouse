                    { id: 36, name: "ALT", refRange: "7–56 U/L", result: "20 U/L", interpretation: "Normal" },
                    { id: 37, name: "Serum sodium", refRange: "135–145 mmol/L", result: "137 mmol/L", interpretation: "Normal" },
                    { id: 38, name: "Serum potassium", refRange: "3.5–5.0 mmol/L", result: "3.9 mmol/L", interpretation: "Normal" },
                    { id: 39, name: "Stool occult blood test", refRange: "Negative", result: "Positive", interpretation: "Positive" },
                    { id: 40, name: "C-reactive protein (CRP)", refRange: "<5 mg/L", result: "28 mg/L", interpretation: "High" }
                ]
            }
        };

        // State variables
        let currentScreen = 'code'; // 'code', 'main', 'timesup'
        let selectedCaseNum = null;
        let timeLeft = 20 * 60; // 20 minutes in seconds
        let timerInterval = null;
        
        let orderedLabIds = [];
        let activePopupLab = null;
        let showOrderedModal = false;
        let searchKeyword = '';

        // Cooldown logic
        let cooldownSecondsLeft = 0;
        let cooldownInterval = null;
        let delayTimes = [10, 20, 30, 40, 60, 75]; // ลำดับเวลาหน่วง: ครั้งที่ 1-6

        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            if (currentScreen === 'code') {
                app.innerHTML = renderCodeScreen();
            } else if (currentScreen === 'main') {
                app.innerHTML = renderMainScreen();
            } else if (currentScreen === 'timesup') {
                app.innerHTML = renderTimesUpScreen();
            }
        }

        function renderCodeScreen() {
            return `
                <div class="flex-1 flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-950">
                    <div class="glass p-8 rounded-2xl shadow-2xl max-w-md w-full border border-slate-700 text-center">
                        <div class="mb-6">
                            <span class="bg-indigo-500/20 text-indigo-400 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">Hematology Open House</span>
                            <h1 class="text-3xl font-bold mt-3 text-white">ระบบสั่งตรวจห้องปฏิบัติการ</h1>
                            <p class="text-slate-400 text-sm mt-2">กรุณากรอกหมายเลขเคสประจำกลุ่มของคุณ (1 ถึง 8)</p>
                        </div>
                        
                        <div class="space-y-4">
                            <div>
                                <input type="number" id="caseInput" min="1" max="8" placeholder="ใส่เลขเคส (1 - 8)" 
                                    class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-center text-2xl font-bold text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                            </div>
                            <button onclick="handleStartCase()" 
                                class="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold rounded-xl shadow-lg shadow-indigo-600/30 transition transform active:scale-95">
                                เริ่มต้นกิจกรรม (Start)
                            </button>
                        </div>
                        <div id="errorMsg" class="text-rose-400 text-sm mt-3 h-5"></div>
                    </div>
                </div>
            `;
        }

        function handleStartCase() {
            const inputVal = document.getElementById('caseInput').value;
            const caseNum = parseInt(inputVal);
            const errorMsg = document.getElementById('errorMsg');

            if (!caseNum || caseNum < 1 || caseNum > 8) {
                errorMsg.innerText = '⚠️ กรุณากรอกหมายเลขเคสให้ถูกต้องระหว่าง 1 ถึง 8';
                return;
            }

            selectedCaseNum = caseNum;
            currentScreen = 'main';
            startTimer();
            render();
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                    if (timeLeft === 0) {
                        clearInterval(timerInterval);
                        currentScreen = 'timesup';
                        render();
                    }
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const timerEl = document.getElementById('timerDisplay');
            if (timerEl) {
                const mins = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;
                timerEl.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                if (timeLeft <= 60) {
                    timerEl.classList.add('text-rose-500', 'animate-pulse');
                }
            }
        }

        function renderMainScreen() {
            const caseInfo = casesData[selectedCaseNum];
            const filteredLabs = caseInfo.labs.filter(lab => 
                lab.name.toLowerCase().includes(searchKeyword.toLowerCase()) || 
                lab.id.toString().includes(searchKeyword)
            );

            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            const timeStr = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

            return `
                <div class="min-h-screen flex flex-col bg-slate-950">
                    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 shadow-md">
                        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
                            <div class="flex items-center space-x-3">
                                <span class="bg-indigo-600 text-white text-sm font-bold px-3 py-1.5 rounded-lg shadow">เคสที่ ${selectedCaseNum}</span>
                            </div>

                            <div class="flex items-center space-x-4">
                                <div class="bg-slate-950 px-4 py-2 rounded-xl border border-slate-800 flex items-center space-x-2">
                                    <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    <span id="timerDisplay" class="font-mono text-xl font-bold ${timeLeft <= 60 ? 'text-rose-500 animate-pulse' : 'text-emerald-400'}">${timeStr}</span>
                                </div>

                                <button onclick="toggleOrderedModal(true)" class="relative bg-violet-600 hover:bg-violet-500 text-white px-4 py-2 rounded-xl font-medium text-sm transition shadow-lg shadow-violet-600/20 flex items-center space-x-2">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                                    <span>Ordered Labs</span>
                                    <span class="absolute -top-2 -right-2 bg-rose-500 text-white text-xs w-6 h-6 rounded-full flex items-center justify-center font-bold border-2 border-slate-900">${orderedLabIds.length}</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6">
                        <div class="mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
                            <div class="w-full sm:w-96 relative">
                                <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                                </span>
                                <input type="text" oninput="handleSearch(this.value)" value="${searchKeyword}" placeholder="ค้นหาชื่อแล็บ หรือลำดับที่..." 
                                    class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                            </div>
                            <div class="text-sm text-slate-400">
                                รายการตรวจทั้งหมด: <span class="font-bold text-white">${caseInfo.labs.length}</span> รายการ | สั่งตรวจแล้ว: <span class="font-bold text-emerald-400">${orderedLabIds.length}</span> รายการ
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                            ${filteredLabs.map(lab => {
                                const isOrdered = orderedLabIds.includes(lab.id);
                                return `
                                    <div onclick="handleSelectLab(${lab.id})" 
                                        class="glass p-4 rounded-xl border ${isOrdered ? 'border-emerald-500/50 bg-emerald-950/10' : 'border-slate-800 hover:border-indigo-500/50'} cursor-pointer transition transform hover:-translate-y-1 shadow-md flex flex-col justify-between">
                                        <div>
                                            <div class="flex justify-between items-start mb-2">
                                                <span class="text-xs font-mono font-bold bg-slate-800 text-indigo-300 px-2 py-0.5 rounded">#${lab.id}</span>
                                                ${isOrdered ? '<span class="text-xs bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded font-medium">สั่งแล้ว</span>' : '<span class="text-xs text-slate-500">แตะเพื่อสั่งตรวจ</span>'}
                                            </div>
                                            <h3 class="font-semibold text-white text-sm line-clamp-2">${lab.name}</h3>
                                        </div>
                                        <div class="mt-4 pt-2 border-t border-slate-800/80 flex justify-between items-center text-xs text-slate-400">
                                            <span class="truncate max-w-[150px]">Ref: ${lab.refRange.split(';')[0]}</span>
                                            <span class="text-indigo-400 font-medium group-hover:underline">ดูผลตรวจ &rarr;</span>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </main>

                    ${cooldownSecondsLeft > 0 ? renderCooldownOverlay() : ''}
                    ${activePopupLab ? renderPopupModal(activePopupLab) : ''}
                    ${showOrderedModal ? renderOrderedModal() : ''}
                </div>
            `;
        }

        function handleSearch(val) {
            searchKeyword = val;
            const gridContainer = document.querySelector('.grid');
            if (gridContainer) {
                render();
                setTimeout(() => {
                    const input = document.querySelector('input[type="text"]');
                    if (input) {
                        input.focus();
                        input.setSelectionRange(input.value.length, input.value.length);
                    }
                }, 0);
            }
        }

        function handleSelectLab(labId) {
            const caseInfo = casesData[selectedCaseNum];
            const lab = caseInfo.labs.find(l => l.id === labId);
            if (!lab) return;

            if (!orderedLabIds.includes(labId)) {
                const orderCount = orderedLabIds.length;
                let delay = delayTimes[orderCount] !== undefined ? delayTimes[orderCount] : 75;

                cooldownSecondsLeft = delay;
                render();

                if (cooldownInterval) clearInterval(cooldownInterval);
                cooldownInterval = setInterval(() => {
                    cooldownSecondsLeft--;
                    if (cooldownSecondsLeft <= 0) {
                        clearInterval(cooldownInterval);
                        if (!orderedLabIds.includes(labId)) {
                            orderedLabIds.push(labId);
                        }
                        activePopupLab = lab;
                        cooldownSecondsLeft = 0;
                        render();
                    } else {
                        updateCooldownDisplay();
                    }
                }, 1000);
            } else {
                activePopupLab = lab;
                render();
            }
        }

        function updateCooldownDisplay() {
            const el = document.getElementById('cooldownCounter');
            if (el) {
                el.innerText = cooldownSecondsLeft;
            }
        }

        function renderCooldownOverlay() {
            const orderCount = orderedLabIds.length + 1;
            return `
                <div class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
                    <div class="glass p-8 rounded-2xl border border-indigo-500/30 text-center max-w-md w-full shadow-2xl animate-fade-in">
                        <div class="w-16 h-16 bg-indigo-600/20 text-indigo-400 rounded-full flex items-center justify-center mx-auto mb-4">
                            <svg class="w-8 h-8 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                        <h3 class="text-xl font-bold text-white mb-2">กำลังส่งตรวจห้องปฏิบัติการ...</h3>
                        <p class="text-slate-400 text-sm mb-6">คำสั่งซื้อแล็บลำดับที่ ${orderCount} (รอผลตรวจสักครู่)</p>
                        
                        <div class="text-5xl font-mono font-extrabold text-indigo-400 mb-2" id="cooldownCounter">${cooldownSecondsLeft}</div>
                        <p class="text-xs text-slate-500 uppercase tracking-widest">วินาที</p>
                    </div>
                </div>
            `;
        }

        function renderPopupModal(lab) {
            return `
                <div class="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl relative text-slate-100">
                        <button onclick="closePopup()" class="absolute top-4 right-4 text-slate-400 hover:text-white p-2 rounded-lg bg-slate-800/50 hover:bg-slate-800 transition">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>

                        <div class="flex items-center space-x-2 mb-3">
                            <span class="bg-indigo-600/20 text-indigo-400 text-xs font-mono font-bold px-2.5 py-1 rounded">Lab #${lab.id}</span>
                            <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2.5 py-1 rounded font-medium">สั่งตรวจสำเร็จ</span>
                        </div>

                        <h2 class="text-xl font-bold text-white mb-4">${lab.name}</h2>

                        <div class="space-y-4 text-sm">
                            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                <span class="text-slate-400 block text-xs mb-1">ค่าปกติ (Reference Range):</span>
                                <p class="font-medium text-slate-200 whitespace-pre-line">${lab.refRange}</p>
                            </div>

                            <div class="bg-indigo-950/30 p-4 rounded-xl border border-indigo-500/30">
                                <span class="text-indigo-300 block text-xs mb-1">ผลตรวจของผู้ป่วย (Result):</span>
                                <p class="text-lg font-bold text-white whitespace-pre-line">${lab.result}</p>
                            </div>

                            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                <span class="text-slate-400 block text-xs mb-1">การแปลผล (Interpretation):</span>
                                <p class="font-semibold text-amber-300 whitespace-pre-line">${lab.interpretation}</p>
                            </div>
                        </div>

                        <div class="mt-6">
                            <button onclick="closePopup()" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-white font-semibold rounded-xl transition">
                                ปิดหน้าต่าง (Close)
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function closePopup() {
            activePopupLab = null;
            render();
        }

        function renderOrderedModal() {
            const caseInfo = casesData[selectedCaseNum];
            const orderedLabsList = caseInfo.labs.filter(l => orderedLabIds.includes(l.id));

            return `
                <div class="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-2xl w-full p-6 shadow-2xl relative max-h-[85vh] flex flex-col">
                        <button onclick="toggleOrderedModal(false)" class="absolute top-4 right-4 text-slate-400 hover:text-white p-2 rounded-lg bg-slate-800/50 hover:bg-slate-800 transition">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>

                        <div class="mb-4">
                            <h2 class="text-xl font-bold text-white flex items-center space-x-2">
                                <svg class="w-6 h-6 text-violet-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                                <span>รายการแล็บที่สั่งตรวจแล้ว (${orderedLabsList.length})</span>
                            </h2>
                            <p class="text-xs text-slate-400">คุณสามารถคลิกเพื่อทบทวนผลตรวจย้อนหลังได้ตลอดเวลา</p>
                        </div>

                        <div class="flex-1 overflow-y-auto space-y-3 pr-2">
                            ${orderedLabsList.length === 0 ? `
                                <div class="text-center py-12 text-slate-500">
                                    <p>ยังไม่มีการสั่งตรวจแล็บใด ๆ</p>
                                </div>
                            ` : orderedLabsList.map(lab => `
                                <div onclick="toggleOrderedModal(false); handleSelectLab(${lab.id})" class="bg-slate-950 p-4 rounded-xl border border-slate-800 hover:border-violet-500 cursor-pointer transition flex justify-between items-center">
                                    <div>
                                        <span class="text-xs font-mono text-indigo-400 bg-slate-900 px-2 py-0.5 rounded">#${lab.id}</span>
                                        <h4 class="font-semibold text-white text-sm mt-1">${lab.name}</h4>
                                    </div>
                                    <div class="text-right">
                                        <span class="text-xs text-emerald-400 font-medium">ผล: ${lab.result}</span>
                                        <p class="text-xs text-indigo-400 mt-0.5">คลิกดูรายละเอียด &rarr;</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <div class="mt-6 pt-4 border-t border-slate-800">
                            <button onclick="toggleOrderedModal(false)" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-white font-semibold rounded-xl transition">
                                ปิดหน้าต่าง
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function toggleOrderedModal(show) {
            showOrderedModal = show;
            render();
        }

        function renderTimesUpScreen() {
            return `
                <div class="flex-1 flex items-center justify-center p-4 bg-gradient-to-br from-rose-950 via-slate-950 to-slate-900">
                    <div class="glass p-8 rounded-2xl shadow-2xl max-w-md w-full border border-rose-500/30 text-center">
                        <div class="w-20 h-20 bg-rose-500/20 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-5 shadow-lg shadow-rose-500/10">
                            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        </div>
                        <h1 class="text-3xl font-bold text-white mb-2">หมดเวลาแล้ว! (Time's Up)</h1>
                        <p class="text-slate-400 text-sm mb-6">เวลาทำกิจกรรม 20 นาทีสิ้นสุดลงแล้ว ผู้เข้าร่วมจะไม่สามารถเปิดดูหรือสั่งตรวจแล็บเพิ่มเติมได้ กรุณาร่วมสรุปผลและรายงานตำรวจ</p>

                        <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-800 mb-6 text-left">
                            <div class="text-xs text-slate-400 mb-1">สถิติกลุ่มของคุณ:</div>
                            <p class="text-sm text-slate-200 font-medium">เคสที่ได้รับ: <span class="text-indigo-400 font-bold">เคสที่ ${selectedCaseNum}</span></p>
                            <p class="text-sm text-slate-200 font-medium">จำนวนแล็บที่ส่งตรวจ: <span class="text-emerald-400 font-bold">${orderedLabIds.length} รายการ</span></p>
                        </div>

                        <button onclick="resetActivity()" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-white font-semibold rounded-xl transition">
                            กลับสู่หน้าหลัก (Reset)
                        </button>
                    </div>
                </div>
            `;
        }

        function resetActivity() {
            currentScreen = 'code';
            selectedCaseNum = null;
            timeLeft = 20 * 60;
            orderedLabIds = [];
            activePopupLab = null;
            showOrderedModal = false;
            if (timerInterval) clearInterval(timerInterval);
            if (cooldownInterval) clearInterval(cooldownInterval);
            render();
        }

        window.onload = () => {
            render();
        };
    </script>
</body>
</html>
